<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Search Command Center</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --green: #00ff00;
  --blue: #58a6ff;
  --gold: #ffd700;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: #010409;
}
h1 { margin: 0; color: var(--green); font-family: 'Courier New', monospace; font-size: 1.4rem; }
.subtitle { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 8px;
  line-height: 1.5;
}
.user { align-self: flex-end; background: #1f6feb22; border: 1px solid #1f6feb44; }
.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
.repo-card {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin: 10px 0;
}
.repo-card a { color: var(--blue); text-decoration: none; font-weight: 600; }
.repo-card a:hover { text-decoration: underline; }
.meta { font-size: 0.85rem; opacity: 0.8; margin: 4px 0 8px; }
#input-area {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: #010409;
  display: flex;
  gap: 8px;
}
input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 1rem;
}
button {
  background: var(--green);
  color: #000;
  border: none;
  padding: 0 20px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.5; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #000; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
footer { text-align: center; padding: 8px; font-size: 0.75rem; opacity: 0.5; }
</style>
</head>
<body>
<header>
  <h1>🔍 Git Search Command Center</h1>
  <div class="subtitle">Phase 1–3 • Language-aware rewrite • Multi-model cascade • Caching • Hybrid index path • Clone-and-Analyze ready</div>
</header>
<div id="chat"></div>
<div id="input-area">
  <input id="query" placeholder="What are you looking for? (e.g. kotlin android full stack)" autofocus>
  <button id="send">Search</button>
</div>
<footer>Built by CodesbyFebin • systems that prove what happened • <a href="https://github.com/CodesbyFebin/git-scraper-engine" style="color:#58a6ff">GitHub</a></footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('query');
const btn = document.getElementById('send');

function addMessage(role, html) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function detectLanguage(q) {
  const map = { kotlin: 'Kotlin', android: 'Kotlin', python: 'Python', rust: 'Rust', go: 'Go', java: 'Java', typescript: 'TypeScript', react: 'TypeScript', swift: 'Swift' };
  const lower = q.toLowerCase();
  for (const [k, v] of Object.entries(map)) if (lower.includes(k)) return v;
  return null;
}

async function searchGitHub(query) {
  const lang = detectLanguage(query);
  let q = encodeURIComponent(query);
  if (lang) q += `+language:${lang}`;
  const url = `https://api.github.com/search/repositories?q=${q}&sort=stars&order=desc&per_page=6`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  return await res.json();
}

function renderRepos(data, originalQuery) {
  if (!data.items || data.items.length === 0) return '<p>No repositories found.</p>';
  let html = `<p><strong>Found ${data.items.length} repositories for:</strong> <code>${originalQuery}</code></p>`;
  data.items.forEach((repo, i) => {
    const stars = '⭐'.repeat(Math.min(5, Math.floor(repo.stargazers_count / 1000) + 1));
    html += `
      <div class="repo-card">
        <a href="${repo.html_url}" target="_blank">${i+1}. ${repo.full_name}</a>
        <div class="meta">${stars} ${repo.stargazers_count.toLocaleString()} stars • ${repo.language || 'Multi'} • Updated ${repo.updated_at.slice(0,10)}</div>
        <div>${repo.description || 'No description'}</div>
      </div>`;
  });
  html += `<p style="opacity:0.6;font-size:0.85rem">Static demo uses public GitHub API. Full engine (query rewrite, multi-model cascade, caching, Phase 2/3) is in the Python package.</p>`;
  return html;
}

async function handleSearch() {
  const q = input.value.trim();
  if (!q) return;
  addMessage('user', q);
  input.value = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Searching...';
  try {
    const data = await searchGitHub(q);
    addMessage('assistant', renderRepos(data, q));
  } catch (e) {
    addMessage('assistant', `<p>Error: ${e.message}. Rate limit or network issue. Try again later or use a token in the full engine.</p>`);
  }
  btn.disabled = false;
  btn.textContent = 'Search';
  input.focus();
}

btn.onclick = handleSearch;
input.onkeydown = e => { if (e.key === 'Enter') handleSearch(); };

addMessage('assistant', 'Welcome to the Git Search Command Center.<br>Type a query like <code>kotlin android full stack</code> or <code>python scraper</code> to search public GitHub repositories.<br><br>This is the static GitHub Pages demo. The full Python engine with Phase 1–3 features lives in the repository.');
</script>
</body>
</html>
